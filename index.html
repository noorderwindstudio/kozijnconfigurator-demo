const ACTIONS = {
  view: el => setView(el.dataset.view),
  home: (el, e) => { e.preventDefault(); setView('config'); },
  step: el => goStep(+el.dataset.step),
  next: () => goStep(state.step + 1),
  prev: () => goStep(state.step - 1),
  'goto-overview': () => { if (state.view !== 'config') setView('config'); goStep(STEPS.length - 1); },
  side: el => { state.side = el.dataset.side; renderStage(); saveDraft(); },
  type: el => { setType(cur(), el.dataset.type); state.side = 'buiten'; renderAll(); },
  vakken: el => { setVakken(cur(), +el.dataset.n); renderAll(); },
  hinge: el => { cur().parts[0].hinge = el.dataset.h; renderAll(); },
  preset: el => { const it = cur(); it.breedte = +el.dataset.b; it.hoogte = +el.dataset.h; renderAll(); },
  aantal: el => { const it = cur(); it.aantal = clamp((isNum(it.aantal) ? it.aantal : 1) + (+el.dataset.d), 1, 50); renderAll(); },
  materiaal: el => { cur().materiaal = el.dataset.id; renderAll(); },
  kleur: el => { cur()[el.dataset.key] = el.dataset.id; state.side = el.dataset.key === 'kleurBinnen' ? 'binnen' : 'buiten'; renderAll(); },
  'same-color': () => { const it = cur(); it.kleurBinnen = it.kleurBuiten; state.side = 'binnen'; renderAll(); toast('Binnenkleur gelijk gemaakt aan buitenkleur.'); },
  glas: el => { cur().glas = el.dataset.id; renderAll(); },
  bd: () => { state.bdOpen = !state.bdOpen; renderSummary(); },
  acc: el => { const id = el.dataset.id, i = state.items.findIndex(x => x.id === id); const curOpen = state.accOpen[id] !== undefined ? state.accOpen[id] : i === state.active; state.accOpen[id] = !curOpen; renderPanel(); },
  'add-item': () => {
    const c = cur();
    if (!itemValid(c)){ toast('Maak eerst het huidige kozijn compleet.', 'err'); return; }
    const it = newItem(c.type); it.materiaal = c.materiaal; it.kleurBuiten = c.kleurBuiten; it.kleurBinnen = c.kleurBinnen; it.glas = c.glas;
    state.items.push(it); state.active = state.items.length - 1; state.step = 0; state.side = 'buiten';
    renderAll(); window.scrollTo({top:0, behavior:'smooth'});
    toast(`Kozijn ${state.items.length} toegevoegd. Materiaal, kleur en glas zijn overgenomen.`, 'ok');
  },
  'edit-item': el => { state.active = +el.dataset.i; state.accOpen = {}; goStep(0); },
  'dup-item': el => { const src = state.items[+el.dataset.i], it = clone(src); it.id = uidStr(); it.parts = clone(src.parts); state.items.splice(+el.dataset.i + 1, 0, it); renderAll(); toast('Kozijn gedupliceerd.', 'ok'); },
  'del-item': el => { const i = +el.dataset.i; confirmModal('Kozijn verwijderen?', `Weet u zeker dat u kozijn ${i + 1} (${TYPES[state.items[i].type].naam}) uit de aanvraag wilt verwijderen?`, 'Verwijderen', () => { state.items.splice(i, 1); state.active = clamp(state.active > i ? state.active - 1 : state.active, 0, state.items.length - 1); renderAll(); toast('Kozijn verwijderd.'); }); },
  submit: () => submitRequest(),
  'print-last': () => { if (state.lastLead) printLead(state.lastLead); },
  'new-request': () => { closeModal(); resetConfigurator(); state.lastLead = null; renderAll(); window.scrollTo({top:0, behavior:'smooth'}); toast('Nieuwe aanvraag gestart.'); },
  'modal-close': () => closeModal(),
  'modal-backdrop': (el, e) => { if (e.target === el) closeModal(); },
  'modal-ok': () => { const cb = confirmModal.cb; confirmModal.cb = null; closeModal(); if (cb) cb(); },
  'reset-demo': () => confirmModal('Reset naar demo-data?', 'Bedrijfsgegevens, logo, kleur, prijzen en offerteaanvragen worden teruggezet naar de demo-instellingen. De huidige configuratie wordt ook gewist.', 'Ja, resetten', () => {
    settings = clone(DEMO_SETTINGS); leads = demoLeads(); save(KEYS.settings, settings); save(KEYS.leads, leads);
    resetConfigurator(); saveDraft(); applyBranding(); renderAdmin(); toast('Demo-data hersteld.', 'ok');
  }),
  'brand-preset': el => { settings.bedrijf.kleur = el.dataset.c; save(KEYS.settings, settings); applyBranding(); renderAdmin(); flashSaved('savedBrand'); },
  'logo-remove': () => { settings.bedrijf.logo = null; save(KEYS.settings, settings); applyBranding(); renderAdmin(); toast('Logo verwijderd; het standaardlogo wordt gebruikt.'); },
  'lead-view': el => showLead(el.dataset.id),
  'lead-print': el => { const l = leads.find(x => x.id === el.dataset.id); if (l) printLead(l); },
  'lead-del': el => { const l = leads.find(x => x.id === el.dataset.id); if (!l) return; confirmModal('Aanvraag verwijderen?', `Offerteaanvraag ${esc(l.ref)} van ${esc(l.klant.naam)} wordt verwijderd.`, 'Verwijderen', () => { leads = leads.filter(x => x.id !== l.id); save(KEYS.leads, leads); renderLeads(); toast('Aanvraag verwijderd.'); }); },
  'export-csv': () => { if (!leads.length){ toast('Er zijn nog geen aanvragen om te exporteren.', 'err'); return; } exportCsv(); },
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.action];
  if (fn){ if (el.tagName === 'A') e.preventDefault(); fn(el, e); }
});
document.addEventListener('input', e => {
  const el = e.target, d = el.dataset;
  if (d.field === 'breedte' || d.field === 'hoogte' || d.field === 'aantal'){
    const v = el.value === '' ? NaN : Number(el.value);
    cur()[d.field] = isNum(v) ? v : NaN;
    updateDimUI(); renderLive(); return;
  }
  if (d.contact && d.contact !== 'akkoord'){
    state.contact[d.contact] = el.value; saveDraft();
    if (state.contactTouched){ const ce = contactErrors(state.contact), k = d.contact; const er = $('#cerr-' + k); if (er) er.innerHTML = ce[k] ? ICON.err + '<span>' + ce[k] + '</span>' : ''; el.classList.toggle('invalid', !!ce[k]); }
    return;
  }
  if (d.setting) return onSetting(el);
  if (d.price) return onPrice(el);
});
document.addEventListener('change', e => {
  const el = e.target, d = el.dataset;
  if (d.part !== undefined){
    const it = cur(), p = it.parts[+d.part];
    if (el.value === 'vast') p.open = false; else { p.open = true; if (el.value.startsWith('open-')) p.hinge = el.value.slice(5); }
    if (!openCount(it)){ it.hor = false; it.beveiliging = 'standaard'; }
    renderAll(); return;
  }
  if (['hor', 'rooster', 'montage', 'brievenbus'].includes(d.field)){ cur()[d.field] = el.checked; renderAll(); return; }
  if (['roede', 'beveiliging', 'dorpel'].includes(d.field)){ cur()[d.field] = el.value; renderAll(); return; }
  if (d.contact === 'akkoord'){ state.contact.akkoord = el.checked; saveDraft(); if (state.contactTouched){ const er = $('#cerr-akkoord'); if (er) er.innerHTML = el.checked ? '' : ICON.err + '<span>' + contactErrors(state.contact).akkoord + '</span>'; } return; }
  if (d.contact && state.contactTouched === false && el.value.trim()){ // valideer veld bij verlaten
    const ce = contactErrors(state.contact), k = d.contact; if (ce[k]){ const er = $('#cerr-' + k); if (er) er.innerHTML = ICON.err + '<span>' + ce[k] + '</span>'; el.classList.add('invalid'); }
    return;
  }
  if (d.leadStatus){ const l = leads.find(x => x.id === d.leadStatus); if (l){ l.status = el.value; save(KEYS.leads, leads); renderLeads(); toast(`Status ${l.ref}: ${STATUS[l.status][0]}.`, 'ok'); } return; }
  if (el.id === 'logoInput') return onLogo(el);
});
document.addEventListener('submit', e => { if (e.target.id === 'contactForm'){ e.preventDefault(); submitRequest(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modalRoot').innerHTML) closeModal(); });

function onSetting(el){
  const k = el.dataset.setting, B = settings.bedrijf;
  if (k === 'kleur' || k === 'kleurHex'){
    let v = el.value.trim(); if (v && v[0] !== '#') v = '#' + v;
    if (!isHex(v)){ el.classList.add('invalid'); return; }
    el.classList.remove('invalid'); B.kleur = v.toUpperCase();
    const other = k === 'kleur' ? $('[data-setting="kleurHex"]') : $('[data-setting="kleur"]');
    if (other) other.value = k === 'kleur' ? v.toUpperCase() : v.toLowerCase();
    $$('.cp').forEach(c => c.classList.toggle('on', c.dataset.c.toLowerCase() === v.toLowerCase()));
  } else {
    B[k] = el.value;
    if (k === 'naam'){ const er = $('#serr-naam'); const empty = !el.value.trim(); el.classList.toggle('invalid', empty); if (er) er.innerHTML = empty ? ICON.err + '<span>Vul een bedrijfsnaam in; deze staat op de configurator en de offerte.</span>' : ''; }
  }
  save(KEYS.settings, settings); applyBranding(); flashSaved('savedBrand');
  const lp = $('#logoPrev'); if (lp) lp.innerHTML = logoHtml();
}
function onPrice(el){
  const path = el.dataset.price, isFactor = /factor$/.test(path), isPct = /^kleur\./.test(path);
  const v = parseFloat(String(el.value).replace(',', '.'));
  const bad = !isNum(v) || v < 0 || (isFactor && (v < .1 || v > 5)) || (isPct && v > 100) || v > 100000;
  el.closest('.affix').classList.toggle('invalid', bad);
  el.title = bad ? (isFactor ? 'Factor tussen 0,1 en 5' : isPct ? 'Percentage tussen 0 en 100' : 'Vul een bedrag van 0 of hoger in') : '';
  if (bad) return;
  setPath(settings.prijzen, path, v);
  save(KEYS.settings, settings); updateAdminExample(); flashSaved('savedPrice');
}
function onLogo(input){
  const f = input.files && input.files[0]; if (!f) return;
  if (!/^image\/(png|jpeg|svg\+xml|webp)$/.test(f.type)){ toast('Kies een PNG-, JPG-, SVG- of WebP-afbeelding.', 'err'); input.value = ''; return; }
  if (f.size > 600 * 1024){ toast('Het logo is groter dan 600 kB. Kies een kleiner bestand.', 'err'); input.value = ''; return; }
  const r = new FileReader();
  r.onload = () => { const prev = settings.bedrijf.logo; settings.bedrijf.logo = r.result; if (!save(KEYS.settings, settings)){ settings.bedrijf.logo = prev; return; } applyBranding(); renderAdmin(); toast('Logo bijgewerkt.', 'ok'); };
  r.onerror = () => toast('Het bestand kon niet worden gelezen.', 'err');
  r.readAsDataURL(f);
}

/* =========================================================
   13. INIT
   ========================================================= */
(function init(){
  if (!Array.isArray(leads)){ leads = demoLeads(); save(KEYS.leads, leads); }
  const d = load(KEYS.draft, null);
  if (d && Array.isArray(d.items) && d.items.length){
    try {
      state.items = d.items.map(sanitizeItem);
      state.active = clamp(parseInt(d.active) || 0, 0, state.items.length - 1);
      state.step = clamp(parseInt(d.step) || 0, 0, STEPS.length - 1);
      state.side = d.side === 'binnen' ? 'binnen' : 'buiten';
      if (d.contact) state.contact = Object.assign(state.contact, d.contact);
      for (let k = 0; k < state.step; k++) if (!stepValid(k)){ state.step = k; break; }
    } catch(err){ resetConfigurator(); }
  } else resetConfigurator();
  applyBranding();
  setView(location.hash === '#beheer' ? 'admin' : 'config');
  window.addEventListener('afterprint', () => { /* printgebied blijft beschikbaar voor herhaald printen */ });
})();
</script>
